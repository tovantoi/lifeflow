<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeFlow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LifeFlow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Nếu app lỗi ngay khi tải (trước khi giao diện kịp hiện), hiển thị thông báo
      // thay vì để màn hình trống, để biết nguyên nhân trên điện thoại.
      (function () {
        function show(msg) {
          var root = document.getElementById('root')
          if (!root || root.childElementCount) return
          root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,sans-serif;color:#e8eef2;background:#0c1419;text-align:center"><div><h2>LifeFlow không tải được</h2><p style="font-size:13px;opacity:.8;word-break:break-word"></p><button onclick="location.reload()" style="padding:10px 18px;border:0;border-radius:10px;background:#2dd4bf;color:#062a26;font-weight:600">Tải lại</button></div></div>'
          root.querySelector('p').textContent = msg
        }
        // Chờ một chút: nếu React vẫn hiển thị được thì không làm gì cả
        window.addEventListener('error', function (e) {
          var msg = e.message || 'Lỗi không xác định'
          setTimeout(function () { show(msg) }, 1500)
        })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
